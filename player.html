<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIMO Player</title><style>html,body{height:100%;margin:0;background:#06111b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.screen{height:100%;display:grid;place-items:center;background:linear-gradient(110deg,#00192b,#0c7070 54%,#dff5f6);position:relative}.screen:before{content:"";position:absolute;right:-7%;height:130%;width:43%;background:linear-gradient(120deg,transparent,#fff9);transform:rotate(15deg)}h1{position:relative;font-size:clamp(26px,6vw,92px);letter-spacing:-.07em;margin:0}.sub{position:relative;margin-top:11px;font-size:clamp(12px,1.7vw,23px);letter-spacing:.18em}.brand{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:1.5vh 3vw;background:#07121edc;font-size:clamp(11px,1.3vw,19px);letter-spacing:.09em}.state{position:absolute;right:14px;top:14px;color:#c6f8f3;font-size:11px;opacity:.75}.state:before{content:"● ";color:#5ed8c9}@media(max-width:600px){h1{font-size:12vw}}</style></head><body><main class="screen"><div><h1>SEMANA DO CLIENTE</h1><div class="sub">REDE UNIÃO · OFERTAS ESPECIAIS</div></div><span class="state" id="state">SINCRONIZADO</span><footer class="brand">SIMO STUDIO · ANUNCIE AQUI · (11) 99999-9999</footer></main><script>const s=document.querySelector('#state');window.addEventListener('offline',()=>s.textContent='REPRODUÇÃO OFFLINE');window.addEventListener('online',()=>s.textContent='SINCRONIZADO');setTimeout(()=>document.documentElement.requestFullscreen?.().catch(()=>{}),600)</script></body></html>
